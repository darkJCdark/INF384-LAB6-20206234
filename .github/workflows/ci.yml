name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Pruebas y gate de cobertura (requisito 5.3): bloquea bajo 80 % de líneas.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm test -- --coverage

  # Gate SCA (requisito 5.1): bloquea con vulnerabilidades altas o críticas.
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Analizar dependencias
        run: npm audit --audit-level=high

  # Gate de secretos (requisito 5.2): escanea todo el historial y bloquea.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar secretos con gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --verbose

  # Gate SAST (requisito 5.4): las reglas propias bloquean; p/javascript solo avisa.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SAST informativo con p/javascript (solo avisa)
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.183.0 semgrep scan --config p/javascript --metrics=off --disable-version-check src/

      - name: SAST bloqueante con reglas propias
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.183.0 semgrep scan --config .semgrep/reglas.yml --error --metrics=off --disable-version-check src/
